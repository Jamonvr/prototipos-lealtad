<div class=&quot;toast&quot; id=&quot;toast&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;></div>

<script>
(function () {
  &quot;use strict&quot;;
  var raiz = document.documentElement;
  var marco = document.getElementById(&quot;marco&quot;);
  var cortina = document.getElementById(&quot;cortina&quot;);
  var toastEl = document.getElementById(&quot;toast&quot;);
  var reduce = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  // El poste de barbero gira con SMIL: se detiene si el visitante pidió menos movimiento.
  var escena = document.getElementById(&quot;escena&quot;);
  function pausaEscena() { try { reduce.matches ? escena.pauseAnimations() : escena.unpauseAnimations(); } catch (e) {} }
  pausaEscena();
  if (reduce.addEventListener) reduce.addEventListener(&quot;change&quot;, pausaEscena);

  /* ---------- Toast ---------- */
  var tt;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add(&quot;ve&quot;);
    clearTimeout(tt);
    tt = setTimeout(function () { toastEl.classList.remove(&quot;ve&quot;); }, 2400);
  }

  /* ---------- Horario: hoy ---------- */
  var hoy = new Date().getDay();
  var li = $('#horario li[data-dia=&quot;' + hoy + '&quot;]');
  if (li) {
    li.classList.add(&quot;hoy&quot;);
    var tag = document.createElement(&quot;span&quot;); tag.className = &quot;tag&quot;; tag.textContent = &quot;Hoy&quot;;
    li.insertBefore(tag, li.querySelector(&quot;.h&quot;));
  }
  if (hoy === 0) {
    $(&quot;#estado&quot;).classList.add(&quot;cerrado&quot;);
    $(&quot;#estado-t&quot;).textContent = &quot;Cerrado hoy · abre el lunes a las 10:00 am&quot;;
  }

  /* ---------- La tarjeta ---------- */
  var META = 6, INICIAL = 2;
  var sellos = INICIAL;
  var HIST0 = [
    { t: &quot;Sello en el mostrador&quot;, f: &quot;sáb 26 sep · 5:42 pm&quot; },
    { t: &quot;Sello en el mostrador&quot;, f: &quot;sáb 12 sep · 12:15 pm&quot; }
  ];
  var hist = HIST0.slice();
  var CHECK = '<svg viewBox=&quot;0 0 24 24&quot;><path d=&quot;M5 12.5l4.5 4.5L19 7.5&quot;/></svg>';

  var puntos = $(&quot;#puntos&quot;), rej = $(&quot;#rej&quot;);
  for (var i = 0; i < META; i++) {
    var p = document.createElement(&quot;span&quot;); p.className = &quot;pt&quot;; p.innerHTML = CHECK; puntos.appendChild(p);
    var s = document.createElement(&quot;span&quot;); s.className = &quot;sello&quot;; rej.appendChild(s);
  }
  var falta = document.createElement(&quot;span&quot;); falta.className = &quot;falta&quot;; puntos.appendChild(falta);

  function reinicia(el, clase) { el.classList.remove(clase); void el.offsetWidth; el.classList.add(clase); }

  function pintar(nuevo) {
    var ganada = sellos >= META, faltan = META - sellos;
    $(&quot;#le-n&quot;).textContent = sellos;
    $(&quot;#le-sub&quot;).textContent = ganada ? &quot;¡Tu corte gratis está listo!&quot; : &quot;para un corte gratis&quot;;
    $(&quot;#lealtad&quot;).classList.toggle(&quot;ganada&quot;, ganada);
    falta.textContent = ganada ? &quot;LISTO&quot; : &quot;FALTAN &quot; + faltan;
    $$(&quot;.pt&quot;, puntos).forEach(function (el, k) {
      el.classList.toggle(&quot;on&quot;, k < sellos);
      if (k === nuevo) reinicia(el, &quot;nuevo&quot;); else el.classList.remove(&quot;nuevo&quot;);
    });
    $$(&quot;.sello&quot;, rej).forEach(function (el, k) {
      var on = k < sellos;
      el.classList.toggle(&quot;on&quot;, on);
      el.textContent = on ? &quot;✓&quot; : String(k + 1);
      if (k === nuevo) reinicia(el, &quot;nuevo&quot;); else el.classList.remove(&quot;nuevo&quot;);
    });
    rej.setAttribute(&quot;aria-label&quot;, sellos + &quot; de &quot; + META + &quot; sellos&quot;);
    rej.setAttribute(&quot;role&quot;, &quot;img&quot;);
    $(&quot;#cuenta&quot;).textContent = sellos + &quot; / &quot; + META;
    $(&quot;#tarj&quot;).classList.toggle(&quot;ganada&quot;, ganada);
    $(&quot;#tarj-pie&quot;).innerHTML = ganada
      ? &quot;<b>¡Tu corte gratis está listo!</b> Enséñale esta pantalla al barbero.&quot;
      : (faltan === 1 ? &quot;Te falta <b>1</b>&quot; : &quot;Te faltan <b>&quot; + faltan + &quot;</b>&quot;) + &quot; para tu <b>corte gratis</b>.&quot;;
    $(&quot;#demo-toque&quot;).textContent = ganada ? &quot;Empezar de nuevo (demo)&quot; : &quot;Simular un toque (demo)&quot;;
    $(&quot;#hist&quot;).innerHTML = hist.map(function (h, k) {
      return '<div class=&quot;mov' + (k === 0 &amp;&amp; nuevo != null &amp;&amp; nuevo >= 0 ? &quot; nuevo&quot; : &quot;&quot;) + '&quot;><span class=&quot;ico-c&quot;><svg viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;><path d=&quot;M5 12.5l4.5 4.5L19 7.5&quot;/></svg></span>' +
        '<div class=&quot;d&quot;><div class=&quot;t&quot;>' + h.t + '</div><div class=&quot;f&quot;>' + h.f + '</div></div><span class=&quot;v&quot;>+1</span></div>';
    }).join(&quot;&quot;);
  }

  function horaAhora() {
    var d = new Date(), h = d.getHours(), m = d.getMinutes();
    var ampm = h >= 12 ? &quot;pm&quot; : &quot;am&quot;; h = h % 12 || 12;
    return &quot;hoy · &quot; + h + &quot;:&quot; + (m < 10 ? &quot;0&quot; : &quot;&quot;) + m + &quot; &quot; + ampm;
  }

  function celebrar() {
    var tarj = $(&quot;#tarj&quot;), envol = $(&quot;#tarj-envol&quot;);
    reinicia(tarj, &quot;gana&quot;);
    try { if (navigator.vibrate) navigator.vibrate([18, 40, 18]); } catch (e) {}
    if (reduce.matches) return;
    var colores = [&quot;var(--ac)&quot;, &quot;#FFFFFF&quot;, &quot;var(--laton)&quot;];
    for (var k = 0; k < 16; k++) {
      var c = document.createElement(&quot;span&quot;); c.className = &quot;chispa&quot;;
      var ang = (Math.PI * 2 * k) / 16 + Math.random() * .3, dist = 90 + Math.random() * 70;
      c.style.setProperty(&quot;--dx&quot;, Math.cos(ang) * dist + &quot;px&quot;);
      c.style.setProperty(&quot;--dy&quot;, Math.sin(ang) * dist * .7 + &quot;px&quot;);
      c.style.setProperty(&quot;--r&quot;, (Math.random() * 360 - 180) + &quot;deg&quot;);
      c.style.setProperty(&quot;--c&quot;, colores[k % 3]);
      c.style.animationDelay = (Math.random() * 80) + &quot;ms&quot;;
      envol.appendChild(c);
      c.addEventListener(&quot;animationend&quot;, function () { this.remove(); });
    }
  }

  $(&quot;#demo-toque&quot;).addEventListener(&quot;click&quot;, function () {
    if (sellos >= META) {
      sellos = INICIAL; hist = HIST0.slice(); pintar(-1);
      toast(&quot;Tarjeta de demo reiniciada: 2 de 6&quot;);
      return;
    }
    sellos++;
    hist.unshift({ t: &quot;Sello en el mostrador&quot;, f: horaAhora() });
    pintar(sellos - 1);
    if (sellos >= META) { toastEl.classList.remove(&quot;ve&quot;); celebrar(); }
    else toast(&quot;Sello nuevo: llevas &quot; + sellos + &quot; de &quot; + META);
  });

  pintar(-1);

  /* ---------- Reseña: el mismo trato con 1 o con 5 ---------- */
  var ESTRELLA = '<svg viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;><path d=&quot;M12 3l2.7 5.9 6.3.7-4.7 4.4 1.3 6.3L12 17.1 6.4 20.3l1.3-6.3L3 9.6l6.3-.7z&quot;/></svg>';
  var PALABRAS = [&quot;Mal&quot;, &quot;Regular&quot;, &quot;Bien&quot;, &quot;Muy bien&quot;, &quot;Excelente&quot;];
  var cajaEstrellas = $(&quot;#estrellas&quot;);
  for (var n = 1; n <= 5; n++) {
    var b = document.createElement(&quot;button&quot;);
    b.type = &quot;button&quot;; b.className = &quot;estrella&quot;; b.dataset.n = n;
    b.setAttribute(&quot;aria-label&quot;, n === 1 ? &quot;1 estrella&quot; : n + &quot; estrellas&quot;);
    b.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
    b.innerHTML = ESTRELLA;
    cajaEstrellas.appendChild(b);
  }
  cajaEstrellas.addEventListener(&quot;click&quot;, function (e) {
    var b = e.target.closest(&quot;.estrella&quot;); if (!b) return;
    var n = Number(b.dataset.n);
    $$(&quot;.estrella&quot;, cajaEstrellas).forEach(function (el, k) {
      var on = k < n;
      el.classList.toggle(&quot;on&quot;, on);
      el.setAttribute(&quot;aria-pressed&quot;, k === n - 1 ? &quot;true&quot; : &quot;false&quot;);
      el.classList.remove(&quot;pop&quot;);
      if (on) { void el.offsetWidth; el.style.animationDelay = (k * 45) + &quot;ms&quot;; el.classList.add(&quot;pop&quot;); }
    });
    $(&quot;#leyenda&quot;).textContent = PALABRAS[n - 1];
    $(&quot;#invita&quot;).hidden = false; // idéntica para cualquier calificación
  });

  /* ---------- Reservar ---------- */
  var fRes = $(&quot;#f-reserva&quot;);
  function mensaje() {
    var dia = fRes.querySelector('input[name=&quot;dia&quot;]:checked').value;
    var hora = fRes.querySelector('input[name=&quot;hora&quot;]:checked').value;
    return &quot;Hola, quiero reservar para &quot; + (dia === &quot;hoy&quot; ? &quot;hoy&quot; : dia) + &quot; a las &quot; + hora + &quot;. ¿Tienen lugar?&quot;;
  }
  function pintaMensaje() { $(&quot;#burbuja-t&quot;).textContent = mensaje(); }
  fRes.addEventListener(&quot;change&quot;, pintaMensaje);
  pintaMensaje();
  fRes.addEventListener(&quot;submit&quot;, function (e) {
    e.preventDefault();
    fRes.hidden = true; $(&quot;#r-exito&quot;).hidden = false;
  });
  $(&quot;#r-otra&quot;).addEventListener(&quot;click&quot;, function () {
    $(&quot;#r-exito&quot;).hidden = true; fRes.hidden = false;
    fRes.querySelector('input[name=&quot;dia&quot;]:checked').focus();
  });

  /* ---------- Wi-Fi ---------- */
  var btnCopiar = $(&quot;#copiar&quot;), tCopiar;
  btnCopiar.addEventListener(&quot;click&quot;, function () {
    var clave = $(&quot;#clave&quot;).textContent.trim();
    function listo() {
      btnCopiar.textContent = &quot;Copiada ✓&quot;;
      clearTimeout(tCopiar);
      tCopiar = setTimeout(function () { btnCopiar.textContent = &quot;Copiar contraseña&quot;; }, 2500);
    }
    function seleccionar() {
      try {
        var r = document.createRange(); r.selectNodeContents($(&quot;#clave&quot;));
        var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      } catch (e) {}
      toast(&quot;No se pudo copiar sola. Ya está seleccionada: cópiala tú.&quot;);
    }
    try {
      if (navigator.clipboard &amp;&amp; navigator.clipboard.writeText) navigator.clipboard.writeText(clave).then(listo, seleccionar);
      else seleccionar();
    } catch (e) { seleccionar(); }
  });

  /* ---------- Opinión anónima ---------- */
  var fOp = $(&quot;#f-opinion&quot;), opTexto = $(&quot;#op-texto&quot;), opFoto = $(&quot;#op-foto&quot;), urlFoto = null;
  opFoto.addEventListener(&quot;change&quot;, function () {
    var f = opFoto.files &amp;&amp; opFoto.files[0];
    if (!f) return;
    if (urlFoto) URL.revokeObjectURL(urlFoto);
    urlFoto = URL.createObjectURL(f);
    $(&quot;#op-img&quot;).src = urlFoto;
    $(&quot;#op-nom&quot;).textContent = f.name;
    $(&quot;#op-adj&quot;).hidden = false;
  });
  function quitaFoto() {
    if (urlFoto) URL.revokeObjectURL(urlFoto);
